# Netlify: deploy this folder as-is (static site, no build step).
# Drag-and-drop the webgame_v2 folder onto app.netlify.com/drop, or link the repo and keep publish = ".".
[build]
  publish = "."

# The page itself always revalidates, so a new deploy shows up immediately.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Sheets, art and music are versioned in index.html (SHEET_V), so they can be cached for a day.
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.mp3"
  [headers.values]
    Cache-Control = "public, max-age=86400"
